<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Conductor Dashboard</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial; background:#121212; color:#f4f4f5; }
      .container { max-width: 980px; margin: 2rem auto; padding: 1rem; }
      table { width:100%; border-collapse: collapse; }
      th, td { padding: 0.75rem 1rem; border-bottom: 1px solid #27272a; }
      th { color:#a1a1aa; text-transform:uppercase; font-size:0.8rem }
      .badge { padding:0.35rem 0.6rem; border-radius:999px; background:#1c1c1c; color:#f4f4f5; border:1px solid #27272a }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Conductor / Admin Dashboard</h1>
      <p>Route occupancy overview</p>
      <table>
        <thead>
          <tr>
            <th>Route ID</th>
            <th>Origin</th>
            <th>Destination</th>
            <th>Capacity</th>
            <th>Booked</th>
          </tr>
        </thead>
        <tbody>
          {% for r in routes %}
          <tr>
            <td>{{ r.route_id }}</td>
            <td>{{ r.origin }}</td>
            <td>{{ r.destination }}</td>
            <td>{{ r.capacity }}</td>
            <td><span class="badge">{{ r.booked_seats }}</span></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
