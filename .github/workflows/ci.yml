name: Transit App CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit and Integration Tests (Coverage Build Gate)
        env:
          CHAPA_SECRET_KEY: CHASECK_TEST-dummy-key
        run: |
          pytest tests/unit tests/integration \
            --cov=src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Run Selenium Headless System Tests
        env:
          CHAPA_SECRET_KEY: CHASECK_TEST-dummy-key
        run: |
          pytest tests/system/test_e2e_booking.py